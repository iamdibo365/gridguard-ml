apiVersion: apps/v1
kind: Deployment
metadata:
  name: gridguard-inference
  namespace: gridguard
  labels:
    app: gridguard-inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gridguard-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gridguard-inference
    spec:
      containers:
        - name: gridguard-inference
          image: 769449464095.dkr.ecr.us-east-1.amazonaws.com/gridguard-inference:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: "/app/model"
            - name: ANOMALY_THRESHOLD
              value: "0.5"
            - name: PREDICTION_LOG_PATH
              value: "/app/logs/predictions.jsonl"
            - name: DATABRICKS_HOST
              valueFrom:
                secretKeyRef:
                  name: gridguard-secrets
                  key: DATABRICKS_HOST
            - name: DATABRICKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gridguard-secrets
                  key: DATABRICKS_TOKEN
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: logs
          emptyDir: {}
