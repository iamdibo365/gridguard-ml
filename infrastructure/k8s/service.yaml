apiVersion: v1
kind: Service
metadata:
  name: gridguard-inference-svc
  namespace: gridguard
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: gridguard-inference
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
