name: GridGuard ML CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPO:   gridguard-inference

jobs:
  # ── JOB 1: DATA QUALITY TESTS ───────────────────────────────────────────
  data-quality:
    name: Data Quality Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Run data quality tests
        run: pytest tests/test_data_quality.py -v
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}

  # ── JOB 2: MODEL VALIDATION GATE ────────────────────────────────────────
  model-validation:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: data-quality
    outputs:
      model_version: ${{ steps.validate.outputs.model_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Validate model quality
        id: validate
        run: |
          python tests/test_model_quality.py
          echo "model_version=$(cat .model_version)" >> $GITHUB_OUTPUT
        env:
          DATABRICKS_HOST:      ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:     ${{ secrets.DATABRICKS_TOKEN }}
          MLFLOW_AUC_THRESHOLD: "0.85"
          MAX_VAL_TEST_AUC_GAP: "0.05"

  # ── JOB 3: DOCKER BUILD & PUSH ──────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: model-validation
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download model artifact
        run: |
          cd inference
          pip install python-dotenv 'mlflow-skinny[databricks]'
          python download_model.py
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Build and push Docker image
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPO:${{ github.sha }}

          cd inference
          DOCKER_BUILDKIT=1 docker build -t $IMAGE_URI .
          docker tag $IMAGE_URI $ECR_REGISTRY/$ECR_REPO:latest
          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPO:latest
          echo "Pushed: $IMAGE_URI"

      - name: Run integration tests
        run: |
          pip install httpx pytest
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker run -d --name gridguard-test -p 8000:8000 \
            -v $(pwd)/inference/model:/app/model \
            -v $(pwd)/inference/logs:/app/logs \
            $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}
          sleep 15
          pytest tests/test_inference.py -v
          docker stop gridguard-test

  
  # ── JOB 4: DEPLOY TO EKS ─────────────────────────────────────────────
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update deployment image
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          IMAGE_URI=$ECR_REGISTRY/gridguard-inference:${{ github.sha }}

          # Update the deployment to use the new image tag
          kubectl set image deployment/gridguard-inference \
            gridguard-inference=$IMAGE_URI \
            -n gridguard

          echo "Updated to image: $IMAGE_URI"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/gridguard-inference \
            -n gridguard \
            --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n gridguard

          echo "=== Service ==="
          kubectl get service gridguard-inference-svc -n gridguard

          LB_URL=$(kubectl get service gridguard-inference-svc \
            -n gridguard \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          echo "Production URL: http://$LB_URL"

          # Health check against production
          sleep 10
          curl -f http://$LB_URL/health || echo "Health check pending"
  
  # ── JOB 5: GOVERNANCE ARTIFACTS ─────────────────────────────────────────
  governance:
    name: Generate Governance Artifacts
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt

      - name: Get champion model version
        id: get-version
        run: |
          VERSION=$(python governance/get_champion_version.py)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Champion version: $VERSION"
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Generate model card and NIST RMF checklist
        run: |
          python governance/generate_model_card.py \
            --model-version ${{ steps.get-version.outputs.version }}
          python governance/nist_rmf_checklist.py
        env:
          DATABRICKS_HOST:       ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:      ${{ secrets.DATABRICKS_TOKEN }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET:             gridguard-ml-data

      - name: Upload governance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: governance-artifacts
          path: governance/output/